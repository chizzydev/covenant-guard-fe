name: Covenant Guard | Fe 26.5.0 security and reproducibility

on:
  push:
    branches: [main, covenant-guard-dev, p08-verification]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-p08-evidence:
    name: Ubuntu 24.04 | Fe + Node + Python oracle + signed EVM + mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Fingerprint observed on the owner's successful Ubuntu 24.04 R4 run,
      # then independently checked against the installed VM compiler binary.
      # Do not accept an unverified, silently substituted compiler.
      P08_LINUX_FE_SHA256: "3732fbe8a6e9d2ea3925d02d0e3a1478bc1e01d742c2be75d3ea7300c46c45f0"
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false

      - name: Node 24 with npm lockfile cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; node24
        with:
          node-version: "24"
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; node24
        with:
          python-version: "3.12"

      - name: Verify corrected source inventory
        run: node p08/ci-source-inventory.mjs

      - name: Install exact tagged Fe release and enforce approved binary hash
        shell: bash
        run: |
          bash scripts/INSTALL_FE_UBUNTU.sh
          test -x "$HOME/.fe/bin/fe"
          echo "${P08_LINUX_FE_SHA256}  $HOME/.fe/bin/fe" | sha256sum -c -
          "$HOME/.fe/bin/fe" --version | grep -F 'fe 26.5.0 (3dab95f)'
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"

      - name: Full corrected P09 qualification
        shell: bash
        run: |
          export P09_FE_EXE="$HOME/.fe/bin/fe"
          bash RUN_P09_UBUNTU.sh

      - name: Preserve generated qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; node24
        with:
          name: covenant-guard-p09-${{ github.run_id }}
          path: |
            results/P06_RUN_LOG.txt
            results/p07/*.json
            results/p08/*.json
            results/p09/*.json
            results/p09/*.txt
          if-no-files-found: error
          retention-days: 14
